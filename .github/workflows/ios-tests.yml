name: iOS Tests

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'supabase/migrations/**'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'supabase/migrations/**'

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create Secrets.xcconfig
        run: |
          cat > Secrets.xcconfig << 'EOF'
          SUPABASE_URL = ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY = ${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ios/.spm-cache
          key: spm-${{ hashFiles('ios/project.yml') }}
          restore-keys: spm-

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme CutSense -clonedSourcePackagesDirPath .spm-cache

      - name: Build & Test
        run: |
          xcodebuild test \
            -scheme CutSenseTests \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -clonedSourcePackagesDirPath .spm-cache \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: ios/TestResults.xcresult

  schema-check:
    name: Schema Drift Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          curl -sSL https://raw.githubusercontent.com/supabase/cli/main/scripts/install.sh | bash

      - name: Validate migrations (dry run)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref xmktbdhilgntfmqovdmb
          echo "--- Checking for pending migrations ---"
          OUTPUT=$(supabase db push --dry-run 2>&1) || true
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Would apply"; then
            echo "::warning::Pending migrations detected — run 'supabase db push' before merging"
          elif echo "$OUTPUT" | grep -q "up to date"; then
            echo "Remote schema is up to date with local migrations."
          else
            echo "::error::Unexpected output from schema check"
            echo "$OUTPUT"
            exit 1
          fi

      - name: Lint migrations SQL
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Checking $f..."
            # Verify each migration is valid SQL (basic syntax check)
            if ! head -1 "$f" > /dev/null 2>&1; then
              echo "::error::Cannot read migration file: $f"
              exit 1
            fi
            # Check for dangerous patterns
            if grep -iP '(DROP\s+TABLE|DROP\s+SCHEMA|TRUNCATE)\s+(?!IF\s+EXISTS)' "$f" 2>/dev/null; then
              echo "::warning::$f contains destructive SQL without IF EXISTS guard"
            fi
            # Check RLS is enabled on new tables
            if grep -qi 'CREATE TABLE' "$f"; then
              TABLE_COUNT=$(grep -ci 'CREATE TABLE' "$f" || true)
              RLS_COUNT=$(grep -ci 'ENABLE ROW LEVEL SECURITY' "$f" || true)
              if [ "$TABLE_COUNT" -gt "$RLS_COUNT" ]; then
                echo "::error::$f creates $TABLE_COUNT tables but only enables RLS on $RLS_COUNT — all tables must have RLS"
                exit 1
              fi
            fi
          done
          echo "All migrations passed lint checks."
