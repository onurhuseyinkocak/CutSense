# App Store release target: QuickSilence silence cutter + AdMob.
# The heavy UGC editor config lives in project.ugc-full.yml (not shippable: source gaps).
name: CutSense
options:
  bundleIdPrefix: com.cutsense
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "13.7.0"

targets:
  CutSense:
    type: application
    platform: iOS
    sources:
      - path: CutSense/QuickSilence
        excludes:
          - "AdStubs.swift"
      - path: CutSense/Ads
      - path: CutSense/Services
        includes:
          - "AppLanguage.swift"
          - "Translations.swift"
      - path: CutSense/Pro
        optional: true
        excludes:
          - "*.storekit" # local StoreKit testing only; schemes reference it directly
      - path: CutSense/Storage
        optional: true
      - path: CutSense/RoughCut/AudioAnalysisService.swift
      - path: CutSense/UI/SettingsScreen.swift
      - path: CutSense/Video/VideoImportService.swift
      - path: CutSense/Video/PhotosSaveService.swift
      - path: CutSense/Resources/Assets.xcassets
      - path: CutSense/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cutsense.app
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: 33
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6HCP552XP8
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: CutSense/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: CutSense
        CFBundleLocalizations: [en, tr, es, pt-BR, de, fr, it, ja, ko]
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "CutSense needs access to your photo library to import videos for editing."
        NSPhotoLibraryAddUsageDescription: "CutSense needs permission to save edited videos to your photo library."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        GADApplicationIdentifier: ca-app-pub-6644397387275334~9083790273
        # Google's published SKAdNetwork list (developers.google.com/admob/ios/3p-skadnetworks, 2026-11-20)
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
