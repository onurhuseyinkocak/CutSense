          UIColorName: LaunchBackground
          UIImageName: SplashLogo
    dependencies:
      - package: GoogleMobileAds

  CutSenseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CutSense/Tests/Release
      - path: CutSense/Pro/Products.storekit
        optional: true
    dependencies:
      - target: CutSense
    settings:
      base:
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: 6HCP552XP8
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  CutSenseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CutSense/Tests/UI
      # SKTestSession in UI tests clears local StoreKit transactions (purchase scenarios).
      - path: CutSense/Pro/Products.storekit
        optional: true
    dependencies:
      - target: CutSense
    settings:
      base:
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: 6HCP552XP8
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CutSense

schemes:
  CutSenseDevice:
    build:
      targets:
        CutSense: all
        CutSenseUITests: [test]
    run:
      storeKitConfiguration: CutSense/Pro/Products.storekit
    test:
      storeKitConfiguration: CutSense/Pro/Products.storekit
      targets:
        - CutSenseUITests
  CutSense:
    build:
      targets:
        CutSense: all
    run:
      storeKitConfiguration: CutSense/Pro/Products.storekit
    test:
      targets:
        - CutSenseTests
