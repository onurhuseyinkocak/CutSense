name: CutSense
options:
  bundleIdPrefix: com.cutsense
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: "4.4.0"

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

targets:
  CutSense:
    type: application
    platform: iOS
    sources:
      - path: CutSense
        excludes:
          - "Tests/**"
    entitlements:
      path: CutSense/CutSense.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cutsense.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 14
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6HCP552XP8
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: CutSense/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: CutSense
        NSPhotoLibraryUsageDescription: "CutSense needs access to your photo library to import videos for editing."
        NSPhotoLibraryAddUsageDescription: "CutSense needs permission to save edited videos to your photo library."
        NSSpeechRecognitionUsageDescription: "CutSense uses speech recognition to transcribe your video for intelligent editing."
        NSMicrophoneUsageDescription: "CutSense may need microphone access for audio analysis."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.cutsense.template
            UTTypeDescription: CutSense Template
            UTTypeConformsTo:
              - public.json
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - cutsensetemplate
        CFBundleDocumentTypes:
          - CFBundleTypeName: CutSense Template
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.cutsense.template
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: SplashLogo
    dependencies:
      - package: Supabase
      - package: Lottie

  CutSenseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CutSense/Tests
        excludes:
          - "**/.gitkeep"
      - path: CutSense/Tests/CutSenseQualityTests/cutsense_test_video.mp4
        type: file
        buildPhase: resources
    dependencies:
      - target: CutSense
    settings:
      base:
        SWIFT_VERSION: "6.0"
        ENABLE_TESTING_SEARCH_PATHS: YES
        GENERATE_INFOPLIST_FILE: YES
