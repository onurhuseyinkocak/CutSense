# App Store release target: QuickSilence silence cutter + AdMob.
# The heavy UGC editor config lives in project.ugc-full.yml (not shippable: source gaps).
name: CutSense
options:
  bundleIdPrefix: com.cutsense
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "13.7.0"

targets:
  CutSense:
    type: application
    platform: iOS
    sources:
      - path: CutSense/QuickSilence
        excludes:
          - "AdStubs.swift"
      - path: CutSense/Ads
      - path: CutSense/Services/AppLanguage.swift
      - path: CutSense/Resources/Assets.xcassets
      - path: CutSense/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cutsense.app
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: 29
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6HCP552XP8
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: CutSense/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: CutSense
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "CutSense needs access to your photo library to import videos for editing."
        NSPhotoLibraryAddUsageDescription: "CutSense needs permission to save edited videos to your photo library."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        GADApplicationIdentifier: ca-app-pub-6644397387275334~9083790273
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: SplashLogo
    dependencies:
      - package: GoogleMobileAds
