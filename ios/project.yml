name: CutSense
options:
  bundleIdPrefix: com.cutsense
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  CutSense:
    type: application
    platform: iOS
    sources:
      - path: CutSense
        excludes:
          - "Tests/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cutsense.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        INFOPLIST_KEY_CFBundleDisplayName: CutSense
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "CutSense needs access to your photo library to import videos for editing."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "CutSense needs permission to save edited videos to your photo library."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "CutSense uses speech recognition to transcribe your video for intelligent editing."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "CutSense may need microphone access for audio analysis."
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: Supabase

  CutSenseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CutSense/Tests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: CutSense
    settings:
      base:
        SWIFT_VERSION: "6.0"
        ENABLE_TESTING_SEARCH_PATHS: YES
        GENERATE_INFOPLIST_FILE: YES
